name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build (release)
        run: cargo build --release

      - name: Publish binary to the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp target/release/republish republish-${{ github.ref_name }}-x86_64-linux
          gh release create "${{ github.ref_name }}" \
            republish-${{ github.ref_name }}-x86_64-linux \
            --title "${{ github.ref_name }}" --generate-notes
